<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<title>Pit Stop Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f13;--bg2:#13161c;--card:#191d25;--card2:#20252f;--line:#2a303c;
  --text:#eef1f6;--muted:#8d96a8;--dim:#5d6575;
  --amber:#ffb21e;--green:#38d98a;--red:#ff5a5f;--blue:#4aa3ff;--wet:#5ab4ff;
  --team:#e8392f;--r:14px;
  --fc:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{min-height:100vh;background:radial-gradient(1200px 500px at 50% -200px,#1c2230 0%,transparent 70%),var(--bg)}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
.h,.num{font-family:var(--fc)}
.app{max-width:760px;margin:0 auto;padding:0 12px 96px}
.hidden{display:none!important}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.top{position:sticky;top:0;z-index:20;margin:0 -12px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(13,15,19,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.badge{width:38px;height:38px;border-radius:10px;background:var(--team);display:grid;place-items:center;font-family:var(--fc);font-weight:800;font-size:20px;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);flex:none}
.top .tn{flex:1;min-width:0}
.top .tn b{display:block;font-family:var(--fc);font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tn small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-family:var(--fc);font-weight:700;font-size:15px;white-space:nowrap}
.chip.money{color:var(--green)}.chip.money.neg{color:var(--red)}.chip.rep{color:var(--amber)}
.chips{display:flex;flex-direction:column;gap:4px;align-items:flex-end}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(15,17,22,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{display:flex;max-width:760px;width:100%}
.nav button{flex:1;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:11.5px;font-weight:600}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--text)}.nav button.on svg{color:var(--amber)}

h2.sec{font-family:var(--fc);font-size:14px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:22px 2px 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.card.warn{margin-top:10px;border-color:#5e2225;background:#1f1012}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}.row.col{flex-direction:column;align-items:stretch;gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:11px;font-weight:700;font-size:15px;background:var(--card2);border:1px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--amber);color:#1a1200;border-color:transparent}
.btn.team{background:var(--team);color:#fff;border-color:transparent}
.btn.green{background:var(--green);color:#002312;border-color:transparent}
.btn.danger{background:var(--red);color:#fff;border-color:transparent}
.btn.danger-t{color:var(--red)}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.38;pointer-events:none}
.sel{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font:inherit;font-weight:600}
.bar{height:7px;border-radius:5px;background:#0e1116;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--amber);transition:width .2s}
.bar.g>i{background:var(--green)}.bar.b>i{background:var(--blue)}.bar.r>i{background:var(--red)}.bar.w>i{background:var(--wet)}
.stat{display:grid;grid-template-columns:104px 1fr 38px;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.stat .num{font-size:16px;font-weight:700;text-align:right}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11.5px;font-weight:700;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.tag.a{color:var(--amber);border-color:#5a4410;background:#2a2108}
.tag.g{color:var(--green);border-color:#145a39;background:#0b2519}
.tag.r{color:var(--red);border-color:#5e2225;background:#2a1012}
.pos{color:var(--green)}.neg{color:var(--red)}

.next{position:relative;overflow:hidden;padding:0}
.next .tv{background:linear-gradient(160deg,#1b3a24,#13261a);height:150px;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.next .tv.oval{background:linear-gradient(160deg,#2a2f38,#181c23)}
.next .tv svg{height:130px;width:auto}
.next .body{padding:14px}
.next .round{font-family:var(--fc);color:var(--amber);font-weight:700;letter-spacing:1.4px;font-size:13px;text-transform:uppercase}
.next .name{font-family:var(--fc);font-size:28px;font-weight:800;line-height:1.05;margin:2px 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi small{color:var(--muted);font-size:12px;display:block}
.kpi b{font-family:var(--fc);font-size:24px;font-weight:700}

table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.st tr:last-child td{border-bottom:0}
table.st td.p{width:28px;font-family:var(--fc);font-weight:700;font-size:16px;text-align:center}
table.st td.pts{text-align:right;font-family:var(--fc);font-weight:700;font-size:16px}
table.st tr.me td{background:rgba(255,178,30,.09)}
table.st tr.me td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.zone-up td.p{color:var(--green)}.zone-down td.p{color:var(--red)}

.garage{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#1a1d23}
.garage svg.car{display:block;width:100%;height:auto}
.part{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.ico{width:48px;height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--amber)}
.ico svg{width:30px;height:30px}
.part .lv,.part2 .lv{font-family:var(--fc);font-weight:700;font-size:13px;color:var(--muted);margin-left:auto}
.nm{font-weight:700;font-size:15.5px}
.ds{font-size:12.5px;color:var(--muted);margin:1px 0 6px}
.pips{display:flex;gap:2px}
.pips i{flex:1;height:6px;border-radius:2px;background:#0e1116}
.pips i.on{background:var(--amber)}
.pips i.mk{box-shadow:-2px 0 0 #ffffff30}
.part2{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center}
.art{position:relative;border-radius:12px;background:radial-gradient(circle at 50% 40%,#2a303b,#15181e);border:1px solid var(--line);padding:4px 4px 16px}
.art svg{display:block;width:100%;height:auto}
.art .stg{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:var(--fc);font-weight:800;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.art.st1 .stg{color:#ff7a73}.art.st2 .stg{color:#6bbcff}.art.st3 .stg{color:#e0b54a}
.art.st3{border-color:#5a4410;box-shadow:0 0 18px rgba(224,181,74,.15) inset}
.art.big{max-width:280px;margin:14px auto}

.drv{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.drv.mk{grid-template-columns:52px 1fr auto}
.helmet{width:64px;height:64px}
.stars{color:var(--amber);letter-spacing:1px;font-size:13px}
.spn{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.logo{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-family:var(--fc);font-weight:800;font-size:17px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.news{list-style:none;margin:0;padding:0}
.news li{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;gap:9px}
.news li:last-child{border-bottom:0}
.news li .e{flex:none}

.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;padding:8px 2px;border-radius:7px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.seg.sm button{padding:6px 2px;font-size:12.5px}
.seg.mode button.on[data-m="0"]{color:var(--green)}
.seg.mode button.on[data-m="2"]{color:var(--red)}

.modal{position:fixed;inset:0;z-index:60;background:rgba(5,6,9,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.modal .mc{background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:780px){.modal{align-items:center}.modal .mc{border-radius:20px;border-bottom:1px solid var(--line);max-width:680px}}
.mc h3{font-family:var(--fc);font-size:26px;margin:0 0 4px;font-weight:800}
.bigpos{font-size:46px;font-weight:800;color:var(--amber)}
.gridlist{max-height:230px;overflow:auto}
.welcome{line-height:1.6;padding-left:18px}
.card.wx b{font-size:15px}
textarea{width:100%;min-height:110px;background:#0b0d11;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,monospace;font-size:11px}
input[type=text],input[type=number]{width:100%;background:#0b0d11;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;font-family:inherit}
label.l{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:36px;height:36px;border-radius:10px;border:2px solid transparent}
.swatches button.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg2) inset}
.disc{display:grid;grid-template-columns:1fr;gap:10px}
.disc button{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left;display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center}
.disc button.on{border-color:var(--amber);background:#221c0e}
.disc b{font-family:var(--fc);font-size:19px;display:block}
.disc small{color:var(--muted);font-size:12px}
.disc svg{width:100%;height:auto;display:block}
.intro{padding-top:calc(24px + env(safe-area-inset-top))}
.logo-title{font-family:var(--fc);font-weight:800;font-size:46px;letter-spacing:2px;line-height:.9;margin:0}
.logo-title span{color:var(--amber);display:block;font-size:.62em;letter-spacing:.32em;margin-top:6px}

/* race */
.race{position:fixed;inset:0;z-index:50;background:#090b0e;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.race .rh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:#0f1217}
.race .rh b{font-family:var(--fc);font-size:19px}
.rwx{font-size:13px;font-weight:700;white-space:nowrap}
.race .lap{font-family:var(--fc);font-weight:800;font-size:22px;color:var(--amber);white-space:nowrap}
.flag{font-size:15px;color:#ffd400}
.race .rbody{flex:1;display:flex;flex-direction:column;min-height:0}
.race .stage{position:relative;flex:none;max-width:760px;width:100%;margin:0 auto}
.race canvas{display:block;width:100%}
.race .ticker{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(0,0,0,.72);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600;min-height:30px;border-left:3px solid var(--amber)}
.race .side{flex:1;display:flex;flex-direction:column;min-height:0;max-width:760px;width:100%;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.race .ctrl{padding:8px 10px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tele{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;margin:8px 10px 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.tcar svg{display:block;width:44px;height:auto}
.tpos{font-family:var(--fc);font-weight:700;font-size:14px;margin-bottom:2px}
.trow{display:grid;grid-template-columns:78px 1fr 84px;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.trow b{font-family:var(--fc);font-size:13.5px;text-align:right;white-space:nowrap}
.trow .bar{height:6px}
.tdmg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin-top:2px}
#tDmg{display:inline-flex;flex-wrap:wrap;gap:2px 10px}
.dchip{font-family:var(--fc);font-weight:700;font-size:13px}
.pitrow{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;align-items:center;margin:8px 10px 0}
.pitrow .pest{grid-column:1/-1;margin-top:-2px}
.boxb{padding:9px 16px;border-radius:9px;background:#3a1e0d;color:var(--amber);font-weight:800;font-family:var(--fc);font-size:18px;letter-spacing:1px;border:1px solid #6a3c12}
.boxb.req{background:var(--amber);color:#1a1200;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,178,30,.25)}}
.race .lb{flex:1;overflow:auto;padding:6px 10px 10px}
.lbr{display:grid;grid-template-columns:26px 12px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13.5px}
.lbr:nth-child(odd){background:#10131a}
.lbr.me{background:rgba(255,178,30,.14)!important;font-weight:700}
.lbr .p{font-family:var(--fc);font-weight:800;font-size:16px;text-align:center}
.lbr .sw{width:12px;height:12px;border-radius:3px}
.lbr .nm{font-size:13.5px;font-weight:inherit;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr .g{font-family:var(--fc);font-weight:600;color:var(--muted);font-size:14px;white-space:nowrap}
.lbr .g.pit{color:var(--amber)}.lbr .g.dnf{color:var(--red)}
.tt{display:inline-block;font-family:var(--fc);font-weight:800;font-size:11px;padding:0 4px;border-radius:4px;background:#173455;color:var(--wet);vertical-align:1px}
@media (min-aspect-ratio:5/4) and (min-width:640px){
  .race .rbody{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}
  .race .stage{max-width:none;height:100%;min-height:0;background:#0b0e12}
  .race .side{max-width:none;border-left:1px solid var(--line)}
}
@media (min-aspect-ratio:5/4) and (min-width:640px) and (max-height:560px){
  .race .rh{padding:5px 10px}.race .ctrl{gap:6px;padding:6px 8px 0}.seg button{padding:5px 2px}
  .tele{margin:6px 8px 0;padding:4px 8px}.tcar svg{width:34px}.tele{grid-template-columns:34px 1fr}
  .pitrow{margin:6px 8px 0}.lbr{padding:3px 8px;font-size:12.5px}
}

.res{display:grid;grid-template-columns:30px 1fr auto auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:14px}
.res.g3{grid-template-columns:30px 1fr auto}
.res .p{font-family:var(--fc);font-weight:800;font-size:17px;text-align:center}
.res.me{background:rgba(255,178,30,.12);border-radius:8px}
.money-line{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.money-line.t{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:700;font-size:16px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:10px 0 4px}
.podium div{width:76px;border-radius:8px 8px 0 0;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 2px;font-size:12px;text-align:center}
.podium div.me{background:#3a2c0b;color:var(--amber)}
.cal{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cal:last-child{border-bottom:0}
.cal svg{width:52px;height:40px}
.cal.cur{background:rgba(255,178,30,.08);border-radius:8px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:#262b36;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* wide screens, tablets, unfolded foldables */
.cols{display:block}
@media(min-width:640px){.disc{grid-template-columns:1fr 1fr 1fr}.disc button{grid-template-columns:1fr;align-items:start}}
@media(min-width:900px){
  .app{max-width:1180px;padding:0 20px 100px}
  .top{margin:0 -20px;padding-left:20px;padding-right:20px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 20px;align-items:start}
  .nav .in{max-width:720px}
  .next .tv{height:190px}.next .tv svg{height:165px}
  .intro .disc{grid-template-columns:1fr}.intro .disc button{grid-template-columns:140px 1fr;align-items:center}
}
@media(min-width:1400px){html,body{font-size:16px}.app{max-width:1320px}}
/* small phones */
@media(max-width:380px){
  html,body{font-size:14px}.app{padding:0 9px 92px}.top{margin:0 -9px;padding-left:9px;padding-right:9px;gap:8px}
  .badge{width:34px;height:34px;font-size:18px}.top .tn b{font-size:17px}.chip{font-size:13.5px;padding:4px 7px}
  .stat{grid-template-columns:88px 1fr 34px;gap:6px}
  .part,.spn{grid-template-columns:40px 1fr auto;gap:9px}.ico,.logo{width:40px;height:40px}.ico svg{width:24px;height:24px}.logo{font-size:14px}
  .part2{grid-template-columns:96px 1fr;gap:9px}
  .disc button{grid-template-columns:90px 1fr}.logo-title{font-size:38px}
  .race .ctrl{grid-template-columns:1fr}.pitrow{grid-template-columns:1fr 1fr}.pitrow .boxb{grid-column:1/-1}
  .trow{grid-template-columns:62px 1fr 74px}
  .nav button{font-size:10.5px}.kpi b{font-size:21px}.next .name{font-size:24px}
}
@media(max-width:300px){.grid2{grid-template-columns:1fr}}

/* v3.1: status markers instead of emoji */
.race .ticker[data-k="radio"]{border-left-color:var(--blue)}
.race .ticker[data-k="warn"]{border-left-color:#ffd400}
.race .ticker[data-k="bad"]{border-left-color:var(--red)}
.race .ticker[data-k="good"]{border-left-color:var(--green)}
.wxd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0;background:#ffd34d}
.wxd.damp{background:#8fb8e0}.wxd.wet{background:#3d8bff}
.flag{font-family:var(--fc);font-weight:800;font-size:13px;letter-spacing:1px;color:#1a1400;background:#ffd400;border-radius:4px;padding:1px 5px;vertical-align:3px}
.flag.red{background:var(--red);color:#fff}
.tt.d{background:#3a1a12;color:#ff8a65}
.boxb.in{background:#123a26;color:var(--green);border-color:#1f6b45}
.boxb.busy{opacity:.55}
.boxb.req.busy{animation:none;background:#5a4a1a;color:#ffd48a;opacity:1}
.news li .nd{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--dim)}

let LANG = 'hu';
function t(k, p) {
  let s = I18N[LANG] && ((p && p.n === 1 && I18N[LANG][k + '.1']) || I18N[LANG][k]);
  if (s == null) s = I18N.en[k];
  if (s == null) return k;
  if (p) s = s.replace(/\{(\w+)\}/g, (m, x) => p[x] != null ? p[x] : m);
  return s;
}
const loc = () => LANG === 'hu' ? 'hu-HU' : 'en-GB';
function initLang() {
  let l = null;
  try { l = localStorage.getItem('boxutca_lang'); } catch (e) { }
  if (!l || !I18N[l]) l = (navigator.language || 'en').toLowerCase().startsWith('hu') ? 'hu' : 'en';
  LANG = l;
}
function setLang(l) {
  if (!I18N[l]) return; LANG = l;
  try { localStorage.setItem('boxutca_lang', l); } catch (e) { }
  render();
}

/* ===================== game state & economy ===================== */
let S = null;

const partRating = l => 8 + l * 4.6;
function carStats(parts, eng, rule) {
  const r = k => partRating(parts[k]);
  const aero = r('aero') * (rule === 'aeroCap' ? .85 : 1);
  const P = r('engine') * .65 + r('gearbox') * .35;
  const H = aero * .45 + r('chassis') * .4 + r('tires') * .15;
  const B = r('brakes');
  const rel = clamp((r('engine') + r('gearbox') + r('chassis') + r('brakes')) / 4 * .65 + eng * 3.2, 0, 100);
  const ovr = P * .38 + H * .37 + B * .15 + r('tires') * .10;
  return { P, H, B, rel, ovr };
}
const salaryFor = skill => Math.round(300 * Math.pow(1.055, skill) / 50) * 50;
const feeFor = (d, years = 2) => Math.round(d.salary * (5 + years * 1.5) / 50) * 50;
function partCost(l, id) {
  let c = 8000 * Math.pow(1.29, l - 1) * (1 - S.staff.shop * .04);
  if (S.rule === 'costCap') c *= .85;
  if (S.rule === 'engineFreeze' && (id === 'engine' || id === 'gearbox')) c *= 1.4;
  return Math.round(c / 50) * 50;
}
// races a part takes to build; the workshop speeds it up
const devTime = l => clamp(2 + (l >= 10 ? 1 : 0) - (S.staff.shop >= 6 ? 1 : 0), 1, 3);
const devSlots = () => 2 + (S.staff.shop >= 5 ? 1 : 0) + (S.staff.shop >= 9 ? 1 : 0);
const inDev = id => S.dev.find(d => d.p === id);
const staffCost = l => Math.round(12000 * Math.pow(1.55, l - 1) / 100) * 100;
const staffUpkeep = l => Math.round(400 * Math.pow(l, 1.35) / 50) * 50;
const upkeep = () => STAFF.reduce((a, k) => a + staffUpkeep(S.staff[k]), 0);
const perRaceCost = () => S.drivers[0].salary + S.drivers[1].salary + upkeep();
const slots = () => Math.min(5, 1 + Math.floor(S.rep / 25) + (S.staff.mkt >= 3 ? 1 : 0));
const stageOf = lv => lv >= STAGES[3] ? 3 : lv >= STAGES[2] ? 2 : lv >= STAGES[1] ? 1 : 0;
// morale (0-100, neutral 60) nudges pace and consistency
const drvEff = d => {
  const m = ((d.morale ?? 60) - 60) / 40;
  return { D: clamp(d.skill + m * 3, 5, 100), K: clamp(d.cons + m * 5, 5, 100), W: clamp(d.wet + m * 3, 5, 100) };
};
const moraleLabel = m => m >= 80 ? 'top' : m >= 62 ? 'good' : m >= 45 ? 'ok' : 'low';

function makeDriver(tier, opts = {}) {
  const base = TIER_BASE[tier];
  const skill = Math.round(clamp(opts.skill ?? rnd(base - 6, base + 24), 15, 97));
  const age = opts.age ?? ri(18, 36);
  const pot = Math.round(clamp(skill + (age < 23 ? rnd(8, 25) : age < 28 ? rnd(3, 14) : rnd(0, 5)), skill, 99));
  const cons = Math.round(clamp(opts.cons ?? rnd(35, 70) + (skill - 40) * .35, 20, 98));
  const wet = Math.round(clamp(opts.wet ?? skill * rnd(.55, 1.05) + rnd(-5, 5), 10, 97));
  const c = pick(TEAM_COLORS.slice(0, 8)), p = randomPerson();
  return {
    name: p.name, nat: p.nat, skill, cons, wet, age, pot, salary: salaryFor(skill), morale: 60, contract: opts.contract ?? 2,
    minRep: Math.max(0, Math.round((skill - 34) * 1.15)), h1: c, h2: pick(['#fff', '#111', '#f5c518', '#e8392f', '#2f7bf5'])
  };
}
const rookie = tier => makeDriver(tier, { skill: Math.max(18, TIER_BASE[tier] - 10), age: 19, contract: 1 });
function makeTeam(tier, id, name, color, boost = 0) {
  const lvl = TIER_BASE[tier] + rnd(-9, 9) + boost;
  const drv = () => { const p = randomPerson(), D = clamp(lvl + rnd(-4, 10), 15, 98); return { ...p, D, W: clamp(D * rnd(.7, 1.05), 10, 98), K: rnd(40, 88), num: 0 }; };
  return {
    id, name, color, P: lvl + rnd(-6, 6), H: lvl + rnd(-6, 6), B: lvl + rnd(-6, 6), rel: clamp(lvl + rnd(0, 20), 30, 98),
    pit: clamp(2 + tier * 2 + ri(-1, 2), 1, 10), setupQ: clamp(rnd(.45, .85) + tier * .03, .3, .95), drivers: [drv(), drv()]
  };
}
function makeField(tier) {
  const names = new Set([S.teamName, S.rival.name]), out = [];
  const nums = new Set([S.num, S.num2]);
  const freeNum = () => { let n; do { n = ri(2, 99); } while (nums.has(n)); nums.add(n); return n; };
  out.push(makeTeam(tier, 'rv', S.rival.name, S.rival.color, 4));   // the rival follows you through the tiers
  for (let i = 0; i < TEAMS - 2; i++) {
    let n; do { n = pick(TEAM_A) + ' ' + pick(TEAM_B); } while (names.has(n)); names.add(n);
    out.push(makeTeam(tier, 't' + i, n, AI_COLORS[i % AI_COLORS.length]));
  }
  out.forEach(tm => tm.drivers.forEach(d => { d.num = freeNum(); }));
  return out;
}
function newCalendar(disc) {
  const pool = tracksOf(disc), sp = DISC[disc].special;
  let idx = shuffle(pool.map((t, i) => i)).slice(0, DISC[disc].rounds);
  if (sp.track) {   // the headline race always runs at its own track
    const ti = pool.findIndex(t => t.id === sp.track);
    idx = idx.filter(i => i !== ti); idx.splice(sp.round, 0, ti); idx = idx.slice(0, DISC[disc].rounds);
  }
  return idx;
}
const tracksOf = d => POOLS[DISC[d].pool];
const isSpecial = (disc, round) => DISC[disc].special.round === round;
function newGame(teamName, color, num, disc) {
  const rv = pick(RIVAL_NAMES);
  S = {
    v: 5, teamName, color, num, num2: num < 99 ? num + 1 : 98, disc, tier: 0, season: 1, round: 0, money: START_MONEY, earned: 0, spent: 0, rep: 5,
    parts: { engine: 2, gearbox: 2, aero: 2, chassis: 2, brakes: 2, tires: 2 },
    staff: { eng: 1, pit: 1, shop: 1, sim: 1, mkt: 1 },
    drivers: [makeDriver(0, { skill: 26, age: 21, cons: 44, wet: 22 }), makeDriver(0, { skill: 22, age: 19, cons: 40, wet: 18, contract: 1 })],
    train: ['skill', 'skill'], sponsors: [], offers: [], market: [],
    rival: { name: rv, color: '#9b59b6' }, feud: 0, h2h: { me: 0, rv: 0 },
    field: [], calendar: newCalendar(disc), results: [], points: {}, dpoints: {},
    dev: [], rule: 'none', setups: {}, stats: { starts: 0, wins: 0, podiums: 0, poles: 0, dnfs: 0, points: 0, laps: 0 }, ach: {},
    news: [], history: [], titles: 0, titleDiscs: []
  };
  S.drivers.forEach(d => { d.salary = salaryFor(d.skill); d.pot = Math.max(d.pot, 60); });
  S.field = makeField(0);
  resetPoints(); genOffers(); genMarket();
  addNews('start', 'news.founded', { team: teamName, series: 'tier.' + disc + '.0' });
  addNews('info', 'news.rival', { r: S.rival.name });
  addNews('info', 'news.tip');
  save();
}
function resetPoints() {
  S.points = { me: 0 }; S.dpoints = { me_0: 0, me_1: 0 };
  S.field.forEach(f => { S.points[f.id] = 0; f.drivers.forEach((d, i) => S.dpoints[f.id + '_' + i] = 0); });
  S.results = []; S.h2h = { me: 0, rv: 0 };
}
// news are stored as translation keys so they follow the selected language
function addNews(type, k, p) { S.news.unshift({ e: type, k, p: p || {} }); S.news = S.news.slice(0, 18); }
function genOffers() {
  const used = new Set(S.sponsors.map(s => s.name));
  const pool = SPONSORS.filter(s => !used.has(s[0]));
  S.offers = shuffle(pool).slice(0, 3).map(([name, color]) => {
    const g = pick(GOALS.slice(0, S.tier >= 1 ? 5 : 4));
    const per = Math.round((1500 + Math.random() * 2500) * TIER_MULT[S.tier] * (1 + S.staff.mkt * .05) * (.75 + S.rep / 100 * .5) / 100) * 100;
    return { name, color, per, goal: { t: g.t, n: g.n }, bonus: Math.round(per * g.f * .8 / 100) * 100, races: ri(4, 12), sign: Math.round(per * rnd(.5, 1.5) / 100) * 100 };
  });
}
function genMarket() {
  S.market = Array.from({ length: 6 }, () => makeDriver(Math.min(3, S.tier + (Math.random() < .25 ? 1 : 0)), { contract: 2 }));
  S.market.sort((a, b) => a.skill - b.skill);
}
function addMoney(n) { n = Math.round(n); S.money += n; if (n >= 0) S.earned += n; else S.spent -= n; }

/* ===================== car setup & practice =====================
   Four settings from 1 to 9. Every track has a hidden ideal; the closer the setup,
   the faster the car. Practice laps give the engineer's feedback. */

  else { wing = 3 + corner * 9 + (1 - tr.ratio) * 4; gear = 8.5 - corner * 10; }

  const id = idealSetup(tr), noise = clamp(1.5 - S.staff.eng * .11 - driver.cons / 220, .25, 1.5);

/* ===================== sound (Web Audio, synthesised – no files) =====================

   Can be switched off; the setting is remembered in this browser. */
const SND = (() => {
  let ctx = null, on = true, eng = null;
  try { on = localStorage.getItem('boxutca_sound') !== '0'; } catch (e) { }
  const ok = () => on && ctx && ctx.state === 'running';

    if (!on) return;

      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();

    o1.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 900; f.Q.value = 3; g.gain.value = 0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(ctx.destination); o1.start(); o2.start();
    eng = { o1, o2, f, g };
  }
  function engine(speed, inPit) {
    if (!eng || !ok()) return;

    const t = ctx.currentTime, s = clamp(speed, 0, 1.3), base = 55 + s * 150 * (inPit ? .55 : 1);
    eng.o1.frequency.setTargetAtTime(base, t, .08); eng.o2.frequency.setTargetAtTime(base * .5, t, .08);
    eng.f.frequency.setTargetAtTime(400 + s * 1400, t, .1);
    eng.g.gain.setTargetAtTime(s > 0 ? .035 + s * .03 : 0, t, .1);
  }
  function stop() { if (!eng) return; try { eng.g.gain.setTargetAtTime(0, ctx.currentTime, .05); const e = eng; setTimeout(() => { try { e.o1.stop(); e.o2.stop(); } catch (x) { } }, 300); } catch (e) { } eng = null; }
  function blip(freq, at, len, vol = .06, type = 'sine') {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(.0001, at + len); o.connect(g); g.connect(ctx.destination); o.start(at); o.stop(at + len + .02);
  }
  function radio() { if (!ok()) return; const t = ctx.currentTime; blip(1250, t, .07); blip(950, t + .09, .09); }
  function gun() {
    if (!ok()) return;
    const t = ctx.currentTime, len = .5, buf = ctx.createBuffer(1, ctx.sampleRate * len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) { const ph = (i / ctx.sampleRate) % .12; d[i] = (Math.random() * 2 - 1) * (ph < .07 ? 1 : .1); }
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = 2500; g.gain.value = .05; src.buffer = buf; src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(t);
    setTimeout(() => { try { const s2 = ctx.createBufferSource(); s2.buffer = buf; s2.connect(f); s2.start(); } catch (e) { } }, 1200);
  }

    on = !on; try { localStorage.setItem('boxutca_sound', on ? '1' : '0'); } catch (e) { }
    if (on) { unlock(); if (R && !R.headless) start(); } else stop();
    paint();
  }
  function paint() { const b = $('#rSnd'); if (b) b.classList.toggle('off', !on); }
  return { start, stop, engine, radio, gun, toggle, unlock, paint, get on() { return on; } };
})();

/* ===================== career: results, morale, press, contracts, achievements ===================== */
// rank of the player's car among all teams (0 = best) -> expected finishing position
function expectedPos() {
  const mine = carStats(S.parts, S.staff.eng, S.rule).ovr + S.staff.eng * .9;
  const rank = S.field.filter(f => (f.P + f.H + f.B) / 3 > mine).length;
  return rank * 2 + 1.5;
}
const achieve = (k, list) => { if (!S.ach[k]) { S.ach[k] = S.season; S.rep = clamp(S.rep + 1.5, 0, 100); list.push(k); } };

function applyRaceResult() {
  const D = DISC[S.disc], ord = raceOrder(), mult = TIER_MULT[S.tier], sp = R.special;
  const pm = sp ? sp.points : 1, prm = sp ? sp.prize : 1;
  ord.forEach((c, i) => {
    if (c.dnf) return;
    const p = POINTS[i] * pm;
    S.points[c.team] = (S.points[c.team] || 0) + p; S.dpoints[c.id] = (S.dpoints[c.id] || 0) + p;
  });
  const my = R.my.map(c => ({ c, pos: ord.indexOf(c) + 1 }));
  const fin = my.filter(m => !m.c.dnf), best = fin.length ? Math.min(...fin.map(m => m.pos)) : 99;
  const prize = Math.round(my.reduce((a, m) => a + (m.c.dnf ? PRIZE[FIELD - 1] * .5 : PRIZE[m.pos - 1]), 0) * mult * prm);
  let spBase = 0, spBonus = 0; const spLines = [];
  S.sponsors.forEach(s => {
    spBase += s.per;
    const ok = best < 99 && (s.goal.t === 'finish' || best <= s.goal.n);
    if (ok) spBonus += s.bonus;
    spLines.push((ok ? '+ ' : '– ') + s.name + ': ' + goalTxt(s.goal));
    s.races--;
  });
  S.sponsors.filter(s => s.races <= 0).forEach(s => addNews('info', 'news.sponsorEnd', { n: s.name }));
  S.sponsors = S.sponsors.filter(s => s.races > 0);
  const sal = S.drivers[0].salary + S.drivers[1].salary, upk = upkeep();
  const repair = Math.round(my.reduce((a, m) => a + m.c.dmgTotal, 0) * 6000 * mult * (1 - S.staff.eng * .03) / 50) * 50;
  const net = prize + spBase + spBonus - sal - upk - repair;
  addMoney(net);
  const repD = best === 99 ? -1.5 : clamp((9 - best) * .45 + (best === 1 ? 2 : 0), -2, 6) * (sp ? 1.5 : 1);
  S.rep = clamp(S.rep + repD, 0, 100);
  // morale: result against expectation, team orders, crashes
  const exp = expectedPos();
  my.forEach(({ c, pos }) => {
    const d = S.drivers[c.seat];
    let dm = c.dnf ? (c.why === 'crash' ? -5 : c.why === 'fuel' ? -3 : -1) : clamp((exp - pos) * .9, -6, 6) + (pos === 1 ? 4 : 0);
    d.morale = clamp(d.morale + dm + (60 - d.morale) * .08, 0, 100);
  });
  if (R.orderUsed && R.orderUsed.kind === 'swap') { const y = R.orderUsed.yielded; S.drivers[y].morale = clamp(S.drivers[y].morale - 8, 0, 100); S.drivers[1 - y].morale = clamp(S.drivers[1 - y].morale + 3, 0, 100); }
  if (R.teamClash) S.drivers.forEach(d => { d.morale = clamp(d.morale - 4, 0, 100); });
  // driver development (training focus gets most of the growth)
  S.drivers.forEach((d, i) => {
    const ageF = d.age < 26 ? 1.3 : d.age > 32 ? .5 : 1, g = (.15 + S.staff.sim * .05) * ageF, tr = S.train[i];
    const gs = { skill: tr === 'skill' ? 1.6 : .35, cons: tr === 'cons' ? 1.6 : .4, wet: tr === 'wet' ? 1.8 : .4 };
    d.skill = Math.min(Math.max(d.skill, d.pot), d.skill + g * gs.skill * (d.skill < d.pot ? 1 : 0));
    d.cons = Math.min(98, d.cons + g * gs.cons);
    d.wet = Math.min(99, Math.max(d.wet, Math.min(d.pot + 8, d.wet + g * gs.wet)));
  });
  S.field.forEach(f => { f.P += rnd(0, .35); f.H += rnd(0, .35); f.B += rnd(0, .3); f.drivers.forEach(d => { d.D = Math.min(98, d.D + rnd(0, .15)); d.W = Math.min(98, d.W + rnd(0, .15)); }); });
  S.results[S.round] = { pos: my.map(m => m.pos), dnf: my.map(m => m.c.dnf) };
  // rival head-to-head
  const rv = ord.filter(c => c.isRival && !c.dnf).map(c => ord.indexOf(c) + 1);
  const rvBest = rv.length ? Math.min(...rv) : 99;
  if (best < rvBest) S.h2h.me++; else if (rvBest < best) S.h2h.rv++;
  // statistics
  const st = S.stats;
  st.starts++; st.points += my.reduce((a, m) => a + (m.c.dnf ? 0 : POINTS[m.pos - 1] * pm), 0);
  if (best === 1) st.wins++; if (best <= 3) st.podiums++;
  const pole = my.some(m => m.c.grid === 1); if (pole) st.poles++;
  st.dnfs += my.filter(m => m.c.dnf).length; st.laps += my.reduce((a, m) => a + m.c.led, 0);
  if (my.some(m => m.c.dnf)) S.seasonDnf = true;
  // parts under construction
  const done = [];
  S.dev.forEach(d => { d.left--; if (d.left <= 0) { S.parts[d.p] = Math.min(MAXLV, S.parts[d.p] + 1); done.push(d.p); addNews('money', 'news.devDone', { p: 'part.' + d.p, l: S.parts[d.p] }); } });
  S.dev = S.dev.filter(d => d.left > 0);
  if (S.feud > 0 && Math.random() < .25) S.feud--;
  // achievements
  const ach = [];
  if (fin.length) achieve('first_finish', ach);
  if (best <= 10) achieve('first_points', ach);
  if (best <= 3) achieve('first_podium', ach);
  if (best === 1) {
    achieve('first_win', ach);
    if (R.wetSum / Math.max(1, R.t) > .4) achieve('rain_win', ach);
    if (my.some(m => m.pos === 1 && m.c.grid >= 8)) achieve('comeback', ach);
    if (sp && sp.kind === 'endurance') achieve('endurance_win', ach);
    if (sp && sp.kind === 'bigrace') achieve('bigrace_win', ach);
  }
  if (pole) achieve('pole', ach);
  if (my.every(m => !m.c.dnf && m.pos <= 2)) achieve('one_two', ach);
  if (my.every(m => !m.c.dnf && m.pos <= 3)) achieve('double_podium', ach);
  if (st.wins >= 10) achieve('ten_wins', ach);
  if (S.money >= 1e6) achieve('millionaire', ach);
  if (PARTS.every(p => S.parts[p] >= STAGES[3])) achieve('full_pro', ach);
  const tname = 'track.' + R.tr.id;
  addNews(best === 99 ? 'bad' : best <= 3 ? 'win' : 'race', best === 99 ? 'news.dnf' : 'news.result', { tr: tname, p: best, pts: POINTS[best - 1] || 0 });
  const events = { interview: makeInterview(best, rvBest, my), poach: maybePoach(), ach, done };
  S.round++;
  genOffers(); genMarket();
  return { ord, my, best, prize, spBase, spBonus, spLines, sal, upk, repair, net, repD, trackId: R.tr.id, special: sp, rvBest, seasonOver: S.round >= D.rounds, events };
}

/* ---------- press interviews ---------- */
// each answer: rep change, morale change per seat, feud change; 'risk' = chance that a denial backfires
function makeInterview(best, rvBest, my) {
  if (Math.random() > .45) return null;
  let q;
  if (R.orderUsed && R.orderUsed.kind === 'swap') q = 'orders';
  else if (R.teamClash || my.some(m => m.c.dnf && m.c.why === 'crash')) q = 'crash';
  else if (best === 1) q = 'win';
  else if (rvBest < best) q = 'rival';
  else q = 'goals';
  return { q, y: R.orderUsed && R.orderUsed.yielded != null ? R.orderUsed.yielded : 0, clashRival: !!R.rivalClash };
}
const IV_FX = {
  win: [{ rep: 1, m: [2, 2] }, { rep: 2, m: [3, -3] }, { rep: 0, m: [1, 1] }],
  rival: [{ rep: 1 }, { rep: 2, feud: 1 }, { rep: 0 }],
  crash: [{ rep: 1, m: [-1, -1] }, { rep: -1, feud: 1 }, { rep: 0, m: [1, 1] }],
  orders: [{ rep: -1, my: 3 }, { rep: 1, risk: .5, fail: -4 }],
  goals: [{ rep: 2, m: [-2, -2] }, { rep: 0, m: [2, 2] }, { rep: 1 }],
};
function applyInterview(iv, k) {
  const fx = IV_FX[iv.q][k]; let caught = false;
  let rep = fx.rep || 0;
  if (fx.risk && Math.random() < fx.risk) { rep = fx.fail; caught = true; }
  S.rep = clamp(S.rep + rep, 0, 100);
  if (fx.m) S.drivers.forEach((d, i) => { d.morale = clamp(d.morale + fx.m[i], 0, 100); });
  if (fx.my) S.drivers[iv.y].morale = clamp(S.drivers[iv.y].morale + fx.my, 0, 100);
  if (fx.feud) S.feud = Math.min(3, S.feud + fx.feud);
  save();
  return { rep, caught };
}

/* ---------- other teams try to sign your drivers ---------- */
function maybePoach() {
  for (let i = 0; i < 2; i++) {
    const d = S.drivers[i];
    const strong = d.skill > TIER_BASE[S.tier] + 12, unhappy = d.morale < 45;
    if ((strong || unhappy) && Math.random() < (unhappy ? .1 : .05)) {
      const from = Math.random() < .5 ? S.rival.name : pick(S.field.filter(f => f.id !== 'rv')).name;
      return { seat: i, from };
    }
  }
  return null;
}
function resolvePoach(ev, keep) {
  const d = S.drivers[ev.seat];
  if (keep) { const raise = Math.round(d.salary * .25 / 50) * 50; d.salary += raise; d.morale = clamp(d.morale + 8, 0, 100); addNews('driver', 'news.kept', { n: d.name, m: money(d.salary) }); }
  else {
    const comp = Math.round(feeFor(d) * .5 / 50) * 50; addMoney(comp);
    addNews('driver', 'news.left', { n: d.name, t: ev.from, m: money(comp) });
    S.drivers[ev.seat] = rookie(S.tier);
  }
  save();
}

/* ---------- season end ---------- */
function teamStandings() {
  const rows = [{ id: 'me', name: S.teamName, color: S.color, pts: S.points.me || 0, me: true }];
  S.field.forEach(f => rows.push({ id: f.id, name: f.name, color: f.color, pts: S.points[f.id] || 0, rival: f.id === 'rv' }));
  rows.sort((a, b) => b.pts - a.pts || (a.me ? -1 : 1)); return rows;
}
function driverStandings() {
  const rows = S.drivers.map((d, i) => ({ id: 'me_' + i, name: d.name, nat: d.nat, team: S.teamName, color: S.color, pts: S.dpoints['me_' + i] || 0, me: true }));
  S.field.forEach(f => f.drivers.forEach((d, i) => rows.push({ id: f.id + '_' + i, name: d.name, nat: d.nat, team: f.name, color: f.color, pts: S.dpoints[f.id + '_' + i] || 0, rival: f.id === 'rv' })));
  rows.sort((a, b) => b.pts - a.pts || (a.me ? -1 : 1)); return rows;
}
function seasonResolve() {
  const rows = teamStandings(), pos = rows.findIndex(r => r.me) + 1;
  const prize = Math.round((CHAMP_PRIZE[pos - 1] || 5000) * TIER_MULT[S.tier]); addMoney(prize);
  const oldTier = S.tier, ach = []; let move = '';
  if (pos === 1) {
    S.titles++; achieve('title', ach);
    if (!S.titleDiscs.includes(S.disc)) S.titleDiscs.push(S.disc);
    if (S.tier === 3) achieve('world_title', ach);
    if (S.titleDiscs.length >= 2) achieve('both_titles', ach);
  }
  if (pos <= PROMOTE && S.tier < 3) { S.tier++; move = 'up'; S.rep = clamp(S.rep + 10, 0, 100); achieve('promotion', ach); }
  else if (pos > TEAMS - RELEGATE && S.tier > 0) { S.tier--; move = 'down'; S.rep = clamp(S.rep - 6, 0, 100); }
  if (!S.seasonDnf) achieve('clean_season', ach);
  if (S.h2h.me > S.h2h.rv) achieve('beat_rival', ach);
  S.history.unshift({ season: S.season, disc: S.disc, tier: oldTier, pos, move, champ: rows[0].name, h2h: { ...S.h2h } });
  // contracts run down; expired ones need a decision
  const expired = [];
  S.drivers.forEach((d, i) => { d.contract--; if (d.contract <= 0) expired.push(i); });
  return { pos, prize, move, oldTier, ach, expired, champ: rows[0].name };
}
const renewSalary = d => Math.round(salaryFor(Math.round(d.skill)) * (d.morale < 45 ? 1.3 : 1.1) / 50) * 50;
function renewDriver(i, years) { const d = S.drivers[i]; d.salary = renewSalary(d); d.contract = years; d.morale = clamp(d.morale + 5, 0, 100); }
function releaseDriver(i) { addNews('driver', 'news.released', { n: S.drivers[i].name }); S.drivers[i] = rookie(S.tier); }
function nextSeason(disc, tier) {
  S.disc = disc; S.tier = tier; S.season++; S.round = 0; S.seasonDnf = false;
  S.field = makeField(tier); S.calendar = newCalendar(disc); resetPoints();
  S.drivers.forEach(d => { d.age++; if (d.age > 33) d.skill = Math.max(15, d.skill - rnd(.5, 2)); d.morale = clamp(d.morale + (60 - d.morale) * .5, 0, 100); });
  S.rule = Math.random() < .4 ? 'none' : pick(RULES.slice(1));
  genOffers(); genMarket();

  if (S.rule !== 'none') addNews('info', 'news.rule', { r: 'rule.' + S.rule });
  save();
}

/* ---------- actions ---------- */
function orderPart(id, rush) {
  const l = S.parts[id], c = rush ? Math.round(partCost(l, id) * 1.6 / 50) * 50 : partCost(l, id);
  if (S.money < c || S.dev.length >= devSlots() || inDev(id) || l >= MAXLV) return false;
  addMoney(-c); S.dev.push({ p: id, left: rush ? 1 : devTime(l) }); save(); return true;
}
function bindView() {
  const v = $('#view');
  v.querySelectorAll('[data-act]').forEach(b => b.onclick = () => ({ weekend: openWeekend, export: openExport, import: openImport, reset: confirmReset, sound: () => { SND.toggle(); render(); } }[b.dataset.act])());
  const ls = v.querySelector('[data-act-lang]'); if (ls) ls.onchange = () => setLang(ls.value);
  v.querySelectorAll('[data-up],[data-rush]').forEach(b => b.onclick = () => {
    const id = b.dataset.up || b.dataset.rush;
    if (orderPart(id, !!b.dataset.rush)) { toast(t('dev.ordered', { p: t('part.' + id), n: inDev(id).left })); render(); }
  });
  v.querySelectorAll('[data-staff]').forEach(b => b.onclick = () => {
    const id = b.dataset.staff, c = staffCost(S.staff[id]); if (S.money < c) return;
    addMoney(-c); S.staff[id]++; save(); toast(t('team.staffToast', { s: t('staff.' + id) })); render();
  });
  v.querySelectorAll('[data-tr]').forEach(b => b.onclick = () => { S.train[+b.dataset.seat] = b.dataset.tr; save(); render(); });
  v.querySelectorAll('#champTab button').forEach(b => b.onclick = () => { CHAMP_TAB = b.dataset.tab; render(); });
  v.querySelectorAll('[data-sign]').forEach(b => b.onclick = () => openSign(+b.dataset.sign));
  v.querySelectorAll('[data-offer]').forEach(b => b.onclick = () => {
    if (S.sponsors.length >= slots()) return;
    const o = S.offers.splice(+b.dataset.offer, 1)[0]; addMoney(o.sign); S.sponsors.push(o);
    addNews('money', 'news.sponsor', { n: o.name, m: money(o.per) }); save(); toast(t('sp.signedToast', { n: o.name, m: money(o.sign) })); render();
  });
  v.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
    const s = S.sponsors[+b.dataset.drop], pen = s.per * 2;
    modal(`<h3>${t('sp.dropT')}</h3><p>${t('sp.dropP', { n: esc(s.name), m: money(pen) })}</p><div class="row"><button class="btn grow" data-close>${t('ui.cancel')}</button><button class="btn grow danger" id="ok">${t('sp.drop')}</button></div>`);
    $('#ok').onclick = () => { addMoney(-pen); S.sponsors.splice(+b.dataset.drop, 1); save(); closeModal(); render(); };
  });
}
function openSign(mi) {

function weekendHead(W) {
  const D = DISC[S.disc];
  const wk = W.wx.rain ? (W.wx.rain === 1 ? 'wet' : 'damp') : 'dry';
  const wxTxt = W.delay ? t('wk.ovalDelay') : W.wx.rain ? (W.wx.rain === 1 ? t('wk.heavyRain') : t('wk.lightRain')) : t('wk.dry');
  return `<h3>${esc(t('track.' + W.tr.id))}${W.special ? ` <span class="tag a">${t('sp.' + W.special.kind)}</span>` : ''}</h3>
   <div class="small muted">${t('home.round', { r: S.round + 1, n: D.rounds, laps: W.laps })}</div>
   <div class="card wx" style="margin-top:12px"><b><i class="wxd ${wk}"></i>${wxTxt}</b><div class="small muted">${t('wk.chance', { p: Math.round(W.tr.rain * 100) })}${W.tr.oval ? ' ' + t('wk.ovalNote') : ''}</div></div>`;
}
function openWeekend() { prepareWeekend(); openPractice(); }
function openPractice() {
  const W = WEEKEND, maxRuns = 3 + (S.staff.sim >= 6 ? 1 : 0);
  const left = maxRuns - W.runs.length;
  const est = W.runs.length ? clamp(setupQuality(W.tr, W.setup) + randn() * (.12 / W.runs.length), 0, 1) : null;
  modal(`${weekendHead(W)}
   <h2 class="sec">${t('pr.title')}</h2>
   <div class="small muted" style="margin:-4px 2px 10px">${t('pr.info')}</div>
   <div class="card">${SETUP.map(k => `<div class="setrow"><div class="row"><b class="grow">${t('set.' + k)}</b><span class="num">${W.setup[k]}</span></div>
     <input type="range" min="1" max="9" step="1" value="${W.setup[k]}" data-set="${k}"><div class="row small muted"><span class="grow">${t('set.' + k + '.lo')}</span><span>${t('set.' + k + '.hi')}</span></div></div>`).join('')}</div>
   <div class="row" style="margin-top:10px"><button class="btn grow" id="prRun" ${left <= 0 ? 'disabled' : ''}>${t('pr.run', { n: left })}</button></div>
   ${est != null ? `<div class="card" style="margin-top:10px"><div class="row"><span class="grow">${t('pr.est')}</span><b class="num">${Math.round(est * 100)}%</b></div><div class="bar g" style="margin-top:6px"><i style="width:${est * 100}%"></i></div></div>` : ''}
   ${W.runs.length ? `<div class="card prlog">${W.runs.map((r, i) => `<div class="prr"><div class="row"><b class="grow">${t('pr.lap', { n: i + 1 })} · ${esc(r.drv)}</b><span class="num">${fmtLap(r.time)}</span></div>${r.fb.map(f => `<div class="small muted">${t(f)}</div>`).join('')}</div>`).reverse().join('')}</div>` : ''}
   <div class="row" style="margin-top:12px"><button class="btn grow" data-close>${t('ui.back')}</button><button class="btn pri grow" id="toQuali">${t('pr.toQuali')}</button></div>`);
  $('#mc').querySelectorAll('[data-set]').forEach(inp => inp.oninput = () => { W.setup[inp.dataset.set] = +inp.value; inp.closest('.setrow').querySelector('.num').textContent = inp.value; });
  $('#prRun').onclick = () => {
    if (W.runs.length >= maxRuns) return;

   ${W.tr.oval ? '' : `<h2 class="sec">${t('wk.startTire')}</h2>${[0, 1].map(s => `<div class="row" style="margin-bottom:6px"><span style="min-width:64px">#${s ? S.num2 : S.num}</span><div class="seg grow" data-wt="${s}"><button data-ty="S" class="${tires[s] === 'S' ? 'on' : ''}">${t('tire.S')}</button><button data-ty="W" class="${tires[s] === 'W' ? 'on' : ''}">${t('tire.W')}</button></div></div>`).join('')}<div class="small muted" style="margin-top:6px">${t('wk.tireInfo')}</div>`}
   <div class="small muted" style="margin:12px 2px">${t('wk.howto')}</div>
   <div class="row"><button class="btn grow" id="backPr">${t('ui.back')}</button><button class="btn pri grow" id="goRace">${t('wk.go')}</button></div>`);
  $('#mc').querySelectorAll('[data-wt]').forEach(sg => sg.onclick = e => { const b = e.target.closest('button'); if (!b) return; tires[+sg.dataset.wt] = b.dataset.ty; sg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); });
  $('#backPr').onclick = openPractice;
  $('#goRace').onclick = () => { SND.unlock(); closeModal(); startRace(tires); };
}

/* ---------- results and the events that follow ---------- */
function finishRace() {
  if (!R) return; cancelAnimationFrame(R.raf); SND.stop();
  const r = applyRaceResult();
  $('#race').classList.add('hidden'); document.body.style.overflow = '';
  R = null; save();
  const { ord, best } = r, podium = ord.slice(0, 3);
  const rows = ord.map((c, i) => `<div class="res ${c.isMe ? 'me' : ''}"><span class="p">${i + 1}</span><span><span class="dot" style="background:${c.color}"></span>#${c.num} ${esc(c.driver)} ${natTag(c.nat)} <span class="muted small">${esc(c.name)}</span>${c.isRival ? ' <span class="tt r">RIV</span>' : ''}</span><span class="small muted">${c.dnf ? 'DNF' : t('res.stops', { n: c.stops })}</span><b class="num">${c.dnf ? 0 : POINTS[i] * (r.special ? r.special.points : 1)}</b></div>`).join('');
  const line = (k, v, cls) => `<div class="money-line"><span>${k}</span><span class="${cls}">${cls === 'neg' ? '−' : '+'}${money(Math.abs(v))}</span></div>`;
  modal(`<h3>${best === 99 ? t('res.dnf') : best === 1 ? t('res.win') : best <= 3 ? t('res.podium') : t('res.finish')}</h3>
   <div class="small muted">${esc(t('track.' + r.trackId))}${r.special ? ' · ' + t('sp.' + r.special.kind) : ''}</div>
   <div class="podium">${[1, 0, 2].map(k => podium[k] ? `<div style="height:${[92, 70, 56][k]}px" class="${podium[k].isMe ? 'me' : ''}"><b class="h" style="font-size:20px">${k + 1}.</b>${esc(podium[k].driver)}</div>` : '').join('')}</div>
   <div class="grid2">${r.my.map(m => `<div class="kpi" style="text-align:center"><b>${m.c.dnf ? 'DNF' : 'P' + m.pos}</b><div class="small muted">#${m.c.num} ${esc(m.c.driver)}</div></div>`).join('')}</div>
   <div class="small muted" style="margin-top:8px">${t('res.rival', { r: esc(S.rival.name), p: r.rvBest === 99 ? 'DNF' : 'P' + r.rvBest, a: S.h2h.me, b: S.h2h.rv })}</div>
   <h2 class="sec">${t('res.money')}</h2>
   <div class="card">
    ${line(t('res.prize2'), r.prize, 'pos')}${line(t('res.spBase'), r.spBase, 'pos')}${line(t('res.spBonus'), r.spBonus, 'pos')}
    ${line(t('res.salary2'), r.sal, 'neg')}${line(t('res.upkeep'), r.upk, 'neg')}${r.repair ? line(t('res.repair'), r.repair, 'neg') : ''}
    <div class="money-line t"><span>${t('res.net')}</span><span class="${r.net >= 0 ? 'pos' : 'neg'}">${r.net >= 0 ? '+' : '−'}${money(Math.abs(r.net))}</span></div>
    ${r.spLines.length ? `<div class="small muted" style="margin-top:8px;line-height:1.6">${r.spLines.map(esc).join('<br>')}</div>` : ''}
    <div class="small muted" style="margin-top:6px">${t('res.rep')}: ${r.repD >= 0 ? '+' : ''}${r.repD.toFixed(1)} ★</div>
   </div>
   <h2 class="sec">${t('res.table')}</h2><div class="card">${rows}</div>
   <button class="btn pri block" style="margin-top:14px" id="cont">${t('ui.continue')}</button>`);
  $('#cont').onclick = () => {
    closeModal();
    if (checkBankrupt()) return;
    const ev = r.events, q = [];
    if (ev.done.length) toast(t('dev.doneToast', { p: ev.done.map(p => t('part.' + p)).join(', ') }));
    if (ev.ach.length) q.push(next => showAch(ev.ach, next));
    if (ev.poach) q.push(next => showPoach(ev.poach, next));
    if (ev.interview) q.push(next => showInterview(ev.interview, next));
    const end = () => { if (r.seasonOver) seasonEnd(); else { VIEW = 'home'; render(); } };
    VIEW = 'home'; render();
    runQueue(q, end);
  };
}
function runQueue(q, end) { const f = q.shift(); if (f) f(() => runQueue(q, end)); else end(); }
function showAch(list, next) {
  modal(`<h3>${t('ach.unlocked')}</h3>${list.map(k => `<div class="ach on" style="margin:8px 0"><b>${t('ach.' + k)}</b><small>${t('ach.' + k + '.d')}</small></div>`).join('')}<button class="btn pri block" id="ok">${t('ui.continue')}</button>`);
  $('#ok').onclick = () => { closeModal(); render(); next(); };
}
function showPoach(ev, next) {
  const d = S.drivers[ev.seat], raise = Math.round(d.salary * .25 / 50) * 50, comp = Math.round(feeFor(d) * .5 / 50) * 50;
  modal(`<h3>${t('po.t')}</h3><p>${t('po.p', { t: esc(ev.from), n: esc(d.name) })}</p>
   <div class="row col"><button class="btn pri" id="keep">${t('po.keep', { m: money(raise) })}</button><button class="btn" id="let">${t('po.let', { m: money(comp) })}</button></div>`);
  $('#keep').onclick = () => { resolvePoach(ev, true); closeModal(); render(); next(); };
  $('#let').onclick = () => { resolvePoach(ev, false); closeModal(); render(); next(); };
}
function showInterview(iv, next) {
  const n = IV_FX[iv.q].length;
  modal(`<h3>${t('iv.t')}</h3><p class="ivq">${t('iv.' + iv.q, { n: esc(S.drivers[iv.y].name), r: esc(S.rival.name) })}</p>
   <div class="row col">${Array.from({ length: n }, (_, k) => `<button class="btn ivo" data-k="${k}">${t('iv.' + iv.q + '.' + k)}</button>`).join('')}</div>`);
  $('#mc').querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const res = applyInterview(iv, +b.dataset.k);
    toast(res.caught ? t('iv.caught') : t('iv.done', { r: (res.rep >= 0 ? '+' : '') + res.rep }));
    closeModal(); render(); next();
  });
}
function checkBankrupt() {
  if (S.money >= -30000 * TIER_MULT[S.tier]) return false;
  modal(`<h3>${t('bk.t')}</h3><p>${t('bk.p', { n: esc(S.teamName) })}</p><p class="small muted">${t('bk.stats', { s: S.season, t: esc(tierName(S.disc, S.tier)), n: S.titles })}</p><button class="btn pri block" id="ok">${t('bk.new')}</button>`);
  $('#ok').onclick = () => { S = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) { } closeModal(); render(); };
  return true;
}
function seasonEnd() {
  const res = seasonResolve();
  const cur = tierName(S.disc, S.tier), other = DISC_KEYS.find(d => d !== S.disc), ot = Math.max(0, S.tier - 1);
  modal(`<h3>${res.pos === 1 ? t('se.champ') : t('se.t')}</h3>
   <div style="text-align:center;margin:8px 0"><span class="h bigpos">${res.pos}.</span><div class="muted">${t('se.pts', { n: S.points.me })}</div></div>
   <div class="card"><div class="money-line"><span>${t('se.prize')}</span><span class="pos">+${money(res.prize)}</span></div>
   <div class="money-line"><span>${res.move ? t('move.' + res.move) : t('se.stay')}</span><b>${esc(cur)}</b></div>
   <div class="money-line"><span>${t('champ.champion')}</span><b>${esc(res.champ)}</b></div>
   <div class="money-line"><span>${t('home.rival')}</span><b>${S.h2h.me}–${S.h2h.rv}</b></div>
   <div class="small muted" style="margin-top:6px">${t('se.info')}</div></div>
   ${res.ach.length ? `<h2 class="sec">${t('ach.unlocked')}</h2>${res.ach.map(k => `<div class="ach on" style="margin:6px 0"><b>${t('ach.' + k)}</b><small>${t('ach.' + k + '.d')}</small></div>`).join('')}` : ''}
   <button class="btn pri block" style="margin-top:14px" id="ok">${t('ui.continue')}</button>`);
  $('#ok').onclick = () => renewals(res.expired.slice(), () => chooseNext(cur, other, ot));
}
function renewals(list, done) {
  const i = list.shift(); if (i == null) { done(); return; }
  const d = S.drivers[i], sal = renewSalary(d);
  modal(`<h3>${t('ct.t')}</h3><p>${t('ct.p', { n: esc(d.name), m: money(sal) })}</p>
   <div class="row col">${[1, 2, 3].map(y => `<button class="btn ${y === 2 ? 'pri' : ''}" data-y="${y}">${t('ct.renew', { n: y })}</button>`).join('')}<button class="btn danger-t" id="rel">${t('ct.release')}</button></div>`);
  $('#mc').querySelectorAll('[data-y]').forEach(b => b.onclick = () => { renewDriver(i, +b.dataset.y); renewals(list, done); });
  $('#rel').onclick = () => { releaseDriver(i); renewals(list, done); };
}
function chooseNext(cur, other, ot) {
  modal(`<h3>${t('se.next')}</h3>
   <div class="row col">
    <button class="btn pri" id="stay">${t('se.continue', { s: esc(cur) })}</button>
    <button class="btn" id="sw">${t('se.switch', { s: esc(tierName(other, ot)), d: t('disc.' + other) })}</button>
   </div>`);
  const fin = () => { closeModal(); VIEW = 'home'; render(); if (S.rule !== 'none') toast(t('rule.' + S.rule)); };
  $('#stay').onclick = () => { nextSeason(S.disc, S.tier); fin(); };
  $('#sw').onclick = () => { addNews('start', 'news.switch', { d: 'disc.' + other }); nextSeason(other, ot); fin(); };
}

/* ---- main.js ---- */
/* ===================== boot ===================== */
initLang();
bindRaceControls();
SND.paint();
S = load();
render();
if (LOAD_MSG) modal(`<h3>${t('load.t')}</h3><p>${t('load.p')}</p><p class="small muted">${t('load.p2')}</p><button class="btn pri block" data-close>${t('load.ok')}</button>`);

})();
</script>
</body>
