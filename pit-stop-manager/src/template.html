<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<title>Pit Stop Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*CSS*/
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top hidden" id="top">
    <div class="badge" id="tBadge">7</div>
    <div class="tn"><b id="tName">Team</b><small id="tSeries">–</small></div>
    <div class="chips"><span class="chip money" id="tMoney">0 CR</span><span class="chip rep" id="tRep">★ 0</span></div>
  </div>
  <main id="view"></main>
</div>
<nav class="nav hidden" id="nav"><div class="in">
  <button data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="nav.home"></span></button>
  <button data-v="garage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l2-5h11l3 3h2v3h-2"/><circle cx="7" cy="16" r="2"/><circle cx="17" cy="16" r="2"/><path d="M9 16h6"/></svg><span data-t="nav.garage"></span></button>
  <button data-v="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a8 8 0 1 1 16 0v3H8a4 4 0 0 1-4-3z"/><path d="M12 10h8"/></svg><span data-t="nav.team"></span></button>
  <button data-v="sponsors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/></svg><span data-t="nav.sponsors"></span></button>
  <button data-v="champ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg><span data-t="nav.champ"></span></button>
</div></nav>

<div class="modal hidden" id="modal"><div class="mc" id="mc"></div></div>

<div class="race hidden" id="race">
  <div class="rh">
    <button class="btn sm" id="rQuit" aria-label="quit">✕</button>
    <div class="grow" style="min-width:0"><b id="rTrack">Track</b><div class="small muted ell" id="rSeries"></div></div>
    <button class="sndb" id="rSnd" aria-label="sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w1" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="w2" d="M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg></button>
    <div class="rwx" id="rWx"></div>
    <div class="lap" id="rLap">1/12</div>
  </div>
  <div class="rbody">
    <div class="stage" id="stage"><canvas id="cv"></canvas><div class="ticker" id="rTick"></div></div>
    <div class="side">
      <div class="ctrl c2">
        <div class="seg carsel" id="rCar"><button data-c="0" class="on">#1</button><button data-c="1">#2</button></div>
        <div class="seg" id="rOrd"><button data-o="free" class="on" data-t="ord.free"></button><button data-o="hold" data-t="ord.hold"></button><button data-o="swap" data-t="ord.swap"></button></div>
      </div>
      <div class="ctrl">
        <div class="seg mode" id="rMode"><button data-m="0" data-t="mode.0"></button><button data-m="1" class="on" data-t="mode.1"></button><button data-m="2" data-t="mode.2"></button></div>
        <div class="seg" id="rSpeed"><button data-s="0" aria-label="pause">❚❚</button><button data-s="0.5" class="on">½×</button><button data-s="1">1×</button><button data-s="2">2×</button><button data-s="4">4×</button><button data-s="99">⏭</button></div>
      </div>
      <div class="tele">
        <div class="tcar" id="teleCar"></div>
        <div class="tinfo">
          <div class="tpos" id="tPos"></div>
          <div class="trow"><span data-t="tele.tires"></span><div class="bar"><i id="tWear"></i></div><b id="tWearT"></b></div>
          <div class="trow"><span data-t="tele.fuel"></span><div class="bar"><i id="tFuel"></i></div><b id="tFuelT"></b></div>
          <div class="tdmg"><span class="muted" data-t="tele.dmg"></span><span id="tDmg"></span></div>
        </div>
      </div>
      <div class="pitrow">
        <div class="seg sm" id="pTire"><button data-ty="S" data-t="tire.S"></button><button data-ty="W" data-t="tire.W"></button><button data-ty="-" data-t="tire.keep"></button></div>
        <div class="seg sm" id="pFuel"><button data-f="full" data-t="fuel.full"></button><button data-f="need" data-t="fuel.need"></button></div>
        <button id="rBox" class="boxb">BOX</button>
        <div class="pest small muted" id="pEst"></div>
      </div>
      <div class="lb" id="rLb"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
"use strict";
/*JS*/
})();
</script>
</body>
</html>
